<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video de Deciflujo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #101f36;
        color: white;
        font-family: Arial, sans-serif;
      }
      main { width: min(100%, 620px); text-align: center; }
      h1 { margin: 0 0 18px; }
      video {
        width: 100%;
        max-height: 82vh;
        border-radius: 18px;
        background: black;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }
      p { color: #d6e4f3; }
    </style>
  </head>
  <body>
    <main>
      <h1>Deciflujo</h1>
      <video controls autoplay muted playsinline poster="deciflujo-linkedin-portada.png">
        <source src="deciflujo-linkedin-demo.mp4" type="video/mp4" />
        Tu navegador no puede reproducir este video.
      </video>
      <p>Entiende tus números. Decide con claridad.</p>
    </main>
  </body>
</html>
