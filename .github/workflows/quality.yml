name: Calidad

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-build-secret-with-more-than-32-characters
          BETTER_AUTH_URL: http://localhost:3000

  e2e-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deciflujo
          POSTGRES_PASSWORD: deciflujo_ci_password
          POSTGRES_DB: deciflujo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deciflujo -d deciflujo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          E2E_DATABASE_URL: postgresql://deciflujo:deciflujo_ci_password@127.0.0.1:5432/deciflujo
